<section class="w g3">${feat('plus','Structured Case Sharing','Every case follows one format: challenge, management, learning points and a discussion question.')}${feat('search','Smart Case Discovery','Search by condition, procedure, specialty or tag instead of digging through chat groups.')}${feat('chat','Professional Peer Discussions','Threaded replies and upvotes surface the most useful perspectives.')}</section>
<section class="w"><h2>Case feed preview</h2>${SEED.slice(0,3).map(card).join('')}</section>

function authP(m){const s=m=='signup';return pub(`<section class="w" style="max-width:520px"><div class="card"><h2>${s?'Create your account':'Welcome back'}</h2><form data-f="${m}">${s?`<label>Full name</label><input name="name" autocomplete="name">`:''}<label>Email</label><input name="email" type="email" autocomplete="email"><label>Password</label><input name="pw" type="password" autocomplete="${s?'new-password':'current-password'}">${s?`<label>Professional role</label><select name="role"><option>Surgeon</option><option>Surgical Resident</option><option>Medical Student</option><option>Other Medical Professional</option></select><label>Institution</label><input name="inst"><label>Licence, registration or student ID (simulated check)</label><input name="reg"><label class="k"><input type="checkbox" name="ok">I understand verification is simulated and I will not post patient-identifiable information.</label>`:''}<p class="er" id="err" role="alert"></p><button class="btn">${s?'Sign up':'Log in'}</button> <button type="button" class="btn o" data-a="demo">Demo login</button></form><p class="mut">Verification statuses: ${bdg({vt:'v'})} ${bdg({vt:'t'})} ${bdg({vt:'s'})} ${bdg({vt:'p'})}. All simulated.</p><p>${s?'Have an account? <button class="lk" data-a="go" data-v="login"><u>Log in</u></button>':'New here? <button class="lk" data-a="go" data-v="signup"><u>Sign up</u></button>'}</p></div></section>`)}
function dash(){const sp=SP.map(s=>[s,all().filter(c=>c.spec==s).length]).sort((a,b)=>b[1]-a[1]).slice(0,5),tg={};all().forEach(c=>c.tags.forEach(t=>tg[t]=(tg[t]||0)+1));
return `<div class="hd"><div><h1 style="font-size:1.6rem">Welcome, ${E(D.user.name.split(' ')[0])}</h1><span class="mut">Latest surgical cases from the community</span></div><button class="btn" data-a="go" data-v="share">${ic('plus',16)} Share a Case</button></div><div class="dg" style="margin-top:14px"><section>${LD?'<div class="sk"></div>'.repeat(3):[...all()].sort((a,b)=>b.d-a.d).map(card).join('')}</section><aside><div class="card"><h3>Trending specialties</h3>${sp.map(s=>`<button class="chip" data-a="pick" data-v="s:${E(s[0])}">${E(s[0])} (${s[1]})</button>`).join('')}</div><div class="card"><h3>Popular tags</h3>${Object.entries(tg).sort((a,b)=>b[1]-a[1]).slice(0,8).map(t=>`<button class="chip" data-a="pick" data-v="t:${E(t[0])}">#${E(t[0])}</button>`).join('')}</div><div class="card"><h3>Recent activity</h3><p class="mut">Dr. Iyer posted a reply on appendicitis.<br>3 new comments on a PCNL case.<br>New vascular case shared today.</p></div></aside></div>`}
function explore(){const A=all();return `<h1 style="font-size:1.6rem">Explore Cases</h1><input data-x="q" value="${E(X.q)}" placeholder="Search keywords, conditions, procedures…" aria-label="Search" style="margin-bottom:10px"><div class="fl"><select data-x="s" aria-label="Specialty">${opts(uniq(A.map(c=>c.spec)),X.s,'All specialties')}</select><select data-x="c" aria-label="Condition">${opts(uniq(A.map(c=>c.cond)),X.c,'All conditions')}</select><select data-x="p" aria-label="Procedure">${opts(uniq(A.map(c=>c.proc)),X.p,'All procedures')}</select><select data-x="t" aria-label="Tag">${opts(uniq(A.flatMap(c=>c.tags)),X.t,'All tags')}</select><select data-x="o" aria-label="Sort"><option value="n" ${X.o=='n'?'selected':''}>Newest</option><option value="d" ${X.o=='d'?'selected':''}>Most discussed</option><option value="u" ${X.o=='u'?'selected':''}>Most upvoted</option></select></div><button class="btn o" data-a="clear">Clear filters</button><div id="res" style="margin-top:12px"></div>`}
function res(){const el=$('#res');if(!el)return;const x=X,q=x.q.toLowerCase().trim();let r=all().filter(c=>(!q||[c.title,c.sum,c.cond,c.proc,c.spec,c.tags.join(' '),c.ch,c.mg].join(' ').toLowerCase().includes(q))&&(!x.s||c.spec==x.s)&&(!x.c||c.cond==x.c)&&(!x.p||c.proc==x.p)&&(!x.t||c.tags.includes(x.t)));r.sort((a,b)=>x.o=='d'?cms(b).length-cms(a).length:x.o=='u'?upc(b)-upc(a):b.d-a.d);el.innerHTML=`<p class="mut">${r.length} case${r.length==1?'':'s'} found</p>`+(r.length?r.map(card).join(''):empty('No cases match','Try clearing a filter or using a different search term.'))}
const tree=(l,pid)=>l.filter(m=>m.p==pid).map(m=>`<div class="cm"><b>${E(m.by)}</b> ${bdg(m)}<p>${E(m.t)}</p><div class="ac"><button data-a="mu" data-v="${m.id}" class="${D.votes['m'+m.id]?'on':''}">${ic('up',14)} ${m.u+(D.votes['m'+m.id]?1:0)}</button><button data-a="rp" data-v="${m.id}">Reply</button></div>${RP==m.id?`<form data-f="reply"><input type="hidden" name="pid" value="${m.id}"><textarea name="t" rows="2" placeholder="Write a reply"></textarea><button class="btn">Post reply</button><p class="er" id="err"></p></form>`:''}${tree(l,m.id)}</div>`).join('');
function studyState(){D.study={notes:{},reviewed:{},bookmarks:[],recent:[],...(D.study||{})};
D.connections={requests:[],saved:[],...(D.connections||{})};D.assistantMessages=Array.isArray(D.assistantMessages)?D.assistantMessages:[];return D.study}
function noteKey(id){return 'case-'+id}
function studyPanel(c){const st=studyState(),key=noteKey(c.id),points=c.ln||[],resources=[{title:'Further reading and references',type:'Reference section',desc:'Review the source material cited by the case author. No external citation is supplied in this demo.',demo:true},{title:'Specialty-based learning',type:'Learning resource',desc:`Explore verified institutional or society guidance for ${c.spec.toLowerCase()} before applying information in practice.`,demo:true}];const reviewed=points.filter((_,i)=>st.reviewed[key+'-'+i]).length;return `<aside class="card study-panel" id="study-workspace"><div class="hd"><div><div class="study-label">Learning companion</div><h2 style="font-size:1.2rem;margin:.25em 0">Study Workspace</h2></div><button class="lk" data-a="study-toggle" aria-label="Collapse study workspace">Hide</button></div><p class="mut" style="font-size:13px">Use this panel to review the case while keeping the article in view.</p><div class="study-label">Key takeaways · ${reviewed}/${points.length} reviewed</div><div class="progress-track" aria-label="Review progress"><span style="width:${points.length?reviewed/points.length*100:0}%"></span></div>${points.map((x,i)=>`<div class="study-point"><input type="checkbox" data-a="review-point" data-v="${c.id}-${i}" ${st.reviewed[key+'-'+i]?'checked':''} aria-label="Mark takeaway reviewed"><span>${E(x)}<br><button class="lk" type="button" data-a="point-bookmark" data-v="${c.id}-${i}">${st.bookmarks.includes(c.id+'-'+i)?'★ Bookmarked':'☆ Bookmark point'}</button></span></div>`).join('')||'<p class="mut">No learning points have been added to this case yet.</p>'}<h3>Clinical pearls</h3><div class="study-resource"><span class="b">Case-derived</span><p>${E(points[0]||'Review the case summary and identify the main clinical decision.')}</p></div><div class="study-resource"><span class="b">Reflection</span><p>What finding would change the management plan, and which local protocol or specialist guidance should be consulted?</p></div><h3>Quick revision</h3><details><summary>Case overview</summary><p class="mut">${E(c.sum)}</p></details><details><summary>Clinical challenge</summary><p class="mut">${E(c.ch)}</p></details><details><summary>Management described</summary><p class="mut">${E(c.mg)}</p></details><h3>Study materials</h3>${resources.map(r=>`<div class="study-resource"><span class="b">${E(r.type)}</span><b>${E(r.title)}</b><p class="mut">${E(r.desc)}</p><span class="mut" style="font-size:11px">Demonstration placeholder · source not independently verified</span></div>`).join('')}<h3>Private study note</h3><label class="sr-only" for="note-${E(c.id)}">Private notes for this case</label><textarea id="note-${E(c.id)}" class="study-note" data-note="${E(c.id)}" placeholder="Write your own revision notes…">${E(st.notes[key]||'')}</textarea><p class="mut" style="font-size:12px">Private to this browser profile. Stored in localStorage; not encrypted or synced.</p><button class="btn" data-a="save-note" data-v="${E(c.id)}">Save note</button> <button class="btn o" data-a="export-note" data-v="${E(c.id)}">Export note</button></aside>`}
function caseP(){const c=byId(R.a);if(!c)return empty('Case not found','This case may have been removed.')+`<button class="btn" data-a="go" data-v="dashboard">Back to feed</button>`;const l=cms(c),rel=all().filter(x=>x.id!=c.id&&(x.spec==c.spec||x.tags.some(t=>c.tags.includes(t)))).slice(0,3),sec=(t,b,id)=>`<section id="${id}"><h2>${t}</h2><p>${b}</p></section>`,st=studyState();st.recent=[c.id,...st.recent.filter(x=>x!==c.id)].slice(0,20);save();const saved=D.saved.includes(c.id);return `<button class="lk" data-a="go" data-v="dashboard">← Back to feed</button><div class="reader-grid"><div class="reader-main"><article class="card reader-article"><div class="mt"><span class="b sp">${E(c.spec)}</span><span class="mut">${ago(c.d)} · Approx. 3 min read</span></div><h1 style="font-size:clamp(1.65rem,3vw,2.25rem);margin-top:12px">${E(c.title)}</h1><p class="mut">${E(c.by)} · ${E(c.role)} ${bdg(c,1)} <span class="mut">(verification is simulated)</span></p><p class="lead" style="font-size:1rem">${E(c.sum)}</p><div class="article-actions"><button class="btn o" data-a="bm" data-v="${c.id}">${ic('bookmark',16)} ${saved?'Saved':'Save case'}</button><button class="btn o" data-a="focus-study">Open Study Workspace</button><button class="btn o" data-a="copy-summary" data-v="${c.id}">Copy summary</button></div><nav class="reader-toc" aria-label="Article sections"><a href="#overview">Overview</a><a href="#challenge">Clinical challenge</a><a href="#management">Management</a><a href="#learning">Learning points</a><a href="#references">References</a></nav>${sec('Case summary',E(c.sum),'overview')}${sec('Clinical challenge',E(c.ch),'challenge')}${sec('Management approach',E(c.mg),'management')}<section id="learning"><h2>Learning points</h2><ul>${(c.ln||[]).map(x=>`<li>${E(x)}</li>`).join('')||'<li>No learning points supplied.</li>'}</ul></section>${c.out?sec('Reported outcome',E(c.out),'outcome'):''}<section><h2>Discussion question</h2><p>${E(c.q)}</p></section><div>${c.tags.map(t=>`<span class="tag">#${E(t)}</span>`).join('')}</div><section id="references"><h2>References and further reading</h2><p class="mut">No source citations were supplied with this demonstration case. Consult current, authoritative specialty guidance and the primary literature. Do not treat the case narrative as a verified clinical guideline.</p><span class="b">Reference verification required</span></section><div class="article-actions"><button data-a="up" data-v="${c.id}" class="${D.votes['c'+c.id]?'on':''}">${ic('up',16)} ${upc(c)} upvotes</button>${D.rep.includes(c.id)?'<span>Reported</span>':`<details><summary>${ic('flag',16)} Report</summary><form data-f="report"><select name="r"><option>Possible patient-identifiable information</option><option>Inappropriate content</option><option>Misleading clinical information</option></select><button class="btn">Submit report</button></form></details>`}</div></article><p class="card mut">${ic('shield',16)} For education only. Discussions and case summaries do not replace clinical judgment, local protocols or specialist consultation.</p><h2>Professional discussion (${l.length})</h2><div class="card"><form data-f="comment"><textarea name="t" rows="3" placeholder="Add a professional, evidence-aware comment…" aria-label="Comment"></textarea><button class="btn">Post comment</button><p class="er" id="err"></p></form>${tree(l,null)||'<p class="mut">No comments yet. Start the discussion.</p>'}</div><h2>Related cases</h2>${rel.length?rel.map(card).join(''):empty('No related cases yet','')}</div>${studyPanel(c)}</div>`}
function studyPage(){const st=studyState(),allCases=all(),q=(window.studyQuery||'').toLowerCase(),type=window.studyType||'all',sort=window.studySort||'recent';let ids=[...new Set([...D.saved,...st.recent,...Object.keys(st.notes).map(k=>k.replace('case-','')),...st.bookmarks.map(k=>k.split('-')[0])])];let items=ids.map(byId).filter(Boolean).filter(c=>!q||[c.title,c.spec,c.cond,c.proc,c.tags.join(' ')].join(' ').toLowerCase().includes(q)).filter(c=>type==='all'||(type==='saved'?D.saved.includes(c.id):type==='notes'?!!st.notes[noteKey(c.id)]:type==='recent'?st.recent.includes(c.id):type==='bookmarks'?st.bookmarks.some(k=>k.startsWith(c.id+'-')):true));if(sort==='alpha')items.sort((a,b)=>a.title.localeCompare(b.title));else if(sort==='recent')items.sort((a,b)=>st.recent.indexOf(a.id)-st.recent.indexOf(b.id));return `<div class="hd"><div><div class="study-label">Personal learning library</div><h1 style="font-size:1.8rem">Study Materials</h1><p class="mut">Your saved cases, revision notes and bookmarked learning points in one place.</p></div><button class="btn o" data-a="go" data-v="explore">Explore cases</button></div><div class="filter-row"><input value="${E(window.studyQuery||'')}" data-study-query placeholder="Search topic, specialty, procedure…" aria-label="Search study materials"><select data-study-type aria-label="Filter study materials"><option value="all" ${type==='all'?'selected':''}>All materials</option><option value="saved" ${type==='saved'?'selected':''}>Saved cases</option><option value="notes" ${type==='notes'?'selected':''}>With personal notes</option><option value="recent" ${type==='recent'?'selected':''}>Recently viewed</option><option value="bookmarks" ${type==='bookmarks'?'selected':''}>Bookmarked points</option></select><select data-study-sort aria-label="Sort materials"><option value="recent" ${sort==='recent'?'selected':''}>Recently viewed</option><option value="alpha" ${sort==='alpha'?'selected':''}>Alphabetical</option></select></div><p class="mut">${items.length} item${items.length===1?'':'s'} · Notes and review status are stored in this browser.</p>${items.length?items.map(c=>`<article class="card resource-row"><div><span class="b sp">${E(c.spec)}</span><h3 style="margin-top:8px">${E(c.title)}</h3><p class="mut">${E(c.cond)} · ${E(c.proc)}</p><p class="mut">${D.saved.includes(c.id)?'Saved case · ':''}${st.notes[noteKey(c.id)]?'Personal note · ':''}${st.bookmarks.some(k=>k.startsWith(c.id+'-'))?'Bookmarked learning points':''}</p>${st.notes[noteKey(c.id)]?`<details><summary>View private note</summary><p class="note-card">${E(st.notes[noteKey(c.id)])}</p></details>`:''}</div><button class="btn" data-a="open" data-v="${c.id}">Continue studying</button></article>`).join(''):empty('Your study library is ready','Save a case, add a private note or bookmark a learning point. Your materials will appear here.')}`}

function share(){const f=(n,l,t,ph='')=>`<label>${l}</label>${t=='a'?`<textarea name="${n}" rows="3" placeholder="${ph}"></textarea>`:`<input name="${n}" placeholder="${ph}">`}`;

function notif(){return `<div class="hd"><h1 style="font-size:1.6rem">Notifications</h1><button class="btn o" data-a="nra">Mark all as read</button></div>`+NT.map(n=>`<div class="card ni ${D.read.includes(n[0])?'':'u'}"><div><span class="b">${n[1]}</span> ${E(n[2])}<br><span class="mut">${n[3]}</span></div><span>${n[4]?`<button class="btn o" data-a="open" data-v="${n[4]}">Open</button>`:''}${D.read.includes(n[0])?'':`<button class="btn o" data-a="nr" data-v="${n[0]}">Mark read</button>`}</span></div>`).join('')}

function assistantReply(message){const m=message.toLowerCase();if(/connect|doctor|hospital|network|colleague/.test(m))return 'To connect with a doctor or hospital, open Connect in the left navigation. Search by specialty or institution and select “Request connection”. This prototype records requests locally; it does not contact real people or institutions.';if(/study|revision|takeaway|notes|bookmark/.test(m))return 'Open a case and use the Study Workspace beside the article. You can review key takeaways, bookmark learning points, write private notes and export your notes. Your demo data stays in this browser.';if(/case|share|post/.test(m))return 'Use Share a Case to submit an educational case. Complete the anonymization checklist and never include patient names, record numbers, exact dates, identifiable images or other identifying details.';if(/guideline|reference|evidence|citation/.test(m))return 'Check the References section of a case and consult current official specialty guidance and primary literature. This demo does not verify sources automatically, and its sample resources may be placeholders.';if(/medical|diagnos|treatment|dose|urgent|emergency|symptom/.test(m))return 'I can help you navigate Medit and organise educational material, but I cannot provide a diagnosis, prescribe treatment or handle urgent clinical decisions. Please consult an appropriately qualified clinician and your institution’s protocols. For emergencies, use local emergency services.';if(/privacy|secure|patient/.test(m))return 'Please do not enter patient-identifiable information here. This prototype stores chat messages in your browser localStorage and is not encrypted or synced. Use only fictional, anonymized examples.';if(/hello|hi|hey/.test(m))return 'Hello! I’m the Medit Guide demo assistant. I can help you find cases, use the Study Workspace, discover the Connect directory or understand prototype features. What would you like to do?';return 'I can help with Medit navigation, study tools, sharing anonymized cases and finding the Connect directory. Try asking “How do I connect with a hospital?” or “Where are my revision notes?”. I’m a local demo assistant, not a clinical decision-support system.'}
